
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>うちの子に会おう</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #fffaf5;
      color: #493d35;
    }

    header {
      padding: 22px 16px;
      text-align: center;
      background: #f4dfcb;
    }

    header h1 { margin: 0 0 8px; font-size: 25px; }
    header p { margin: 0; font-size: 14px; }

    main { max-width: 700px; margin: auto; padding: 20px 16px; }

    .cat-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .cat-card {
      background: white;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 2px 8px #00000010;
    }

    .cat-icon {
      height: 100px;
      display: grid;
      place-items: center;
      background: #f8eee4;
      border-radius: 12px;
      font-size: 58px;
    }

    .cat-card h2 { font-size: 18px; margin: 12px 0 6px; }
    .cat-card p { font-size: 13px; line-height: 1.6; min-height: 40px; }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px;
      background: #bd7954;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .cat-card button, .ar-button { width: 100%; }

    .back-button {
      background: #e8ded5;
      color: #493d35;
      margin-bottom: 16px;
    }

    .profile, .ar-panel {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-top: 16px;
    }

    .profile h2 { margin-top: 0; }
    .profile p { line-height: 1.8; }
    .ar-button { margin-top: 12px; }

    model-viewer {
      width: 100%;
      height: 55vh;
      min-height: 300px;
      background: #f2f2f2;
      border-radius: 12px;
    }

    .note { color: #77685e; font-size: 12px; line-height: 1.6; }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <header>
    <h1>うちの子に会おう 🐾</h1>
    <p>気になる猫と、いっしょに暮らす未来を想像しよう。</p>
  </header>

  <main>
    <section id="list-screen">
      <h2>気になる猫を選んでください</h2>
      <div id="cat-list" class="cat-list"></div>
      <p class="note">※ 掲載している猫は動作確認用のサンプルです。</p>
    </section>

    <section id="detail-screen" hidden>
      <button class="back-button" id="back-button">← 猫一覧に戻る</button>

      <div class="profile">
        <h2 id="cat-name"></h2>
        <p id="cat-age"></p>
        <p id="cat-personality"></p>
        <p id="cat-likes"></p>
        <p id="cat-care"></p>
      </div>

      <button class="ar-button" id="show-ar-button">この子をARで見る</button>

      <section id="ar-panel" class="ar-panel" hidden>
        <h2>お部屋で会ってみよう</h2>
        <model-viewer
          id="cat-model"
          src="./domestic-cat-sitting.glb"
          alt="猫の3Dモデル"
          ar
          ar-modes="webxr scene-viewer quick-look"
          camera-controls
          touch-action="pan-y"
          shadow-intensity="1">
        </model-viewer>
        <p class="note">ARボタンを押すと、対応端末では部屋に配置できます。</p>
      </section>
    </section>
  </main>

  <script>
    const cats = [
      {
        name: "ミケ",
        age: "推定2歳",
        personality: "性格：好奇心旺盛で遊ぶのが好き",
        likes: "好きなこと：おもちゃで遊ぶこと",
        care: "暮らす前のポイント：毎日遊ぶ時間を確保しましょう。",
        icon: "🐈"
      },
      {
        name: "ソラ",
        age: "推定4歳",
        personality: "性格：おだやかで、ゆっくり過ごすのが好き",
        likes: "好きなこと：窓辺で外を眺めること",
        care: "暮らす前のポイント：安心して休める場所を用意しましょう。",
        icon: "🐈‍⬛"
      },
      {
        name: "モモ",
        age: "推定1歳",
        personality: "性格：活発で、探検するのが好き",
        likes: "好きなこと：いろいろな場所を探検すること",
        care: "暮らす前のポイント：安全な遊び場を用意しましょう。",
        icon: "🐱"
      }
    ];

    const listScreen = document.getElementById("list-screen");
    const detailScreen = document.getElementById("detail-screen");
    const catList = document.getElementById("cat-list");
    const arPanel = document.getElementById("ar-panel");

    function showCats() {
      cats.forEach(function(cat) {
        const card = document.createElement("article");
        card.className = "cat-card";

        const icon = document.createElement("div");
        icon.className = "cat-icon";
        icon.textContent = cat.icon;

        const title = document.createElement("h2");
        title.textContent = cat.name;

        const description = document.createElement("p");
        description.textContent = cat.personality;

        const button = document.createElement("button");
        button.textContent = "この子を見る";
        button.addEventListener("click", function() {
          showProfile(cat);
        });

        card.append(icon, title, description, button);
        catList.appendChild(card);
      });
    }

    function showProfile(cat) {
      document.getElementById("cat-name").textContent = cat.icon + " " + cat.name;
      document.getElementById("cat-age").textContent = cat.age;
      document.getElementById("cat-personality").textContent = cat.personality;
      document.getElementById("cat-likes").textContent = cat.likes;
      document.getElementById("cat-care").textContent = cat.care;

      arPanel.hidden = true;
      listScreen.hidden = true;
      detailScreen.hidden = false;
    }

    document.getElementById("back-button").addEventListener("click", function() {
      detailScreen.hidden = true;
      listScreen.hidden = false;
    });

    document.getElementById("show-ar-button").addEventListener("click", function() {
      arPanel.hidden = false;
      arPanel.scrollIntoView({ behavior: "smooth" });
    });

    showCats();
  </script>
</body>
</html>
