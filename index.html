
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Life AR - 猫との暮らしを体験</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #fff8f0;
      color: #40342e;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      color: #a96743;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #76685f;
      font-size: 14px;
    }

    #cat-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }

    .cat-card {
      background: white;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 3px 12px #0000000d;
      overflow: hidden;
    }

    .cat-photo {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      background: #eee5dc;
    }

    .cat-card h2 {
      font-size: 19px;
      margin: 12px 0 6px;
    }

    .cat-card p {
      font-size: 13px;
      line-height: 1.6;
      min-height: 40px;
      color: #76685f;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      background: #b87850;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #965b38;
    }

    .cat-card button {
      width: 100%;
    }

    #profile {
      display: none;
      max-width: 600px;
      margin: 0 auto;
    }

    #profile-photo {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 16px;
    }

    #profile h2 {
      color: #a96743;
    }

    .profile-info {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin: 16px 0;
      line-height: 1.8;
    }

    #ar-section {
      margin-top: 24px;
      background: white;
      padding: 16px;
      border-radius: 16px;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 350px;
      background: #f3ece5;
      border-radius: 12px;
      --poster-color: #f3ece5;
    }

    .hint {
      font-size: 13px;
      color: #76685f;
      line-height: 1.7;
    }

    .back-button {
      margin-bottom: 18px;
      background: #76685f;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #8b7d73;
      margin-top: 32px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🐈 Cat Life AR</h1>
    <p class="subtitle">猫との暮らしを、迎える前に体験してみよう。</p>
  </header>

  <main>
    <section id="cat-list-section">
      <h2>一緒に暮らしたい猫を選ぼう</h2>
      <p class="hint">
        気になる猫のプロフィールを見て、お部屋での暮らしをARで体験できます。
      </p>
      <div id="cat-list"></div>
    </section>

    <section id="profile">
      <button class="back-button" id="back-button">← 猫の一覧に戻る</button>

      <img id="profile-photo" src="" alt="猫の写真">

      <h2 id="profile-name"></h2>

      <div class="profile-info">
        <p><strong>年齢：</strong><span id="profile-age"></span></p>
        <p><strong>性格：</strong><span id="profile-personality"></span></p>
        <p><strong>好きなこと：</strong><span id="profile-likes"></span></p>
        <p><strong>一緒に暮らすポイント：</strong><span id="profile-care"></span></p>
      </div>

      <section id="ar-section">
        <h2>お部屋で一緒に暮らしてみよう</h2>
        <p class="hint">
          下のARボタンを押して、床などの平らな場所に猫を配置してみましょう。
          スマートフォンの機種やブラウザによってはARに対応していない場合があります。
        </p>

        <model-viewer
          id="cat-model"
          src="./domestic-cat-sitting.glb"
          alt="座っている猫の3Dモデル"
          ar
          ar-modes="webxr scene-viewer quick-look"
          camera-controls
          touch-action="pan-y"
          shadow-intensity="1"
          environment-image="neutral">
        </model-viewer>

        <p class="hint">
          💡 猫を迎える前に、生活スペースや家具の配置を想像してみましょう。
          猫によって性格や行動は異なります。
        </p>
      </section>
    </section>
  </main>

  <footer>
    Cat Life AR — 猫を迎える前の暮らし体験
  </footer>

  <script>
    const cats = [
      {
        name: "ミケ",
        age: "2歳",
        personality: "好奇心旺盛で、人と遊ぶのが好き。",
        likes: "おもちゃ遊び、窓の外を眺めること。",
        care: "遊ぶ時間をつくり、安全に過ごせる場所を用意しましょう。",
        image: "./mike.jpg"
      },
      {
        name: "ソラ",
        age: "1歳",
        personality: "元気いっぱいで、活発に動くタイプ。",
        likes: "走り回ること、高い場所に登ること。",
        care: "上下運動ができる場所や、誤飲しそうな物がない環境が大切です。",
        image: "./sora.jpg"
      },
      {
        name: "モモ",
        age: "4歳",
        personality: "落ち着いていて、自分のペースを大切にするタイプ。",
        likes: "静かな場所で休むこと、ゆっくり過ごすこと。",
        care: "猫がひとりで安心して休める場所を用意しましょう。",
        image: "./momo.jpg"
      }
    ];

    const catList = document.getElementById("cat-list");
    const listSection = document.getElementById("cat-list-section");
    const profile = document.getElementById("profile");

    cats.forEach((cat, index) => {
      const card = document.createElement("article");
      card.className = "cat-card";

      const photo = document.createElement("img");
      photo.className = "cat-photo";
      photo.src = cat.image;
      photo.alt = cat.name + "の写真";
      photo.loading = "lazy";

      const name = document.createElement("h2");
      name.textContent = cat.name;

      const personality = document.createElement("p");
      personality.textContent = cat.personality;

      const button = document.createElement("button");
      button.textContent = "プロフィールを見る";
      button.addEventListener("click", () => showProfile(index));

      card.append(photo, name, personality, button);
      catList.appendChild(card);
    });

    function showProfile(index) {
      const cat = cats[index];

      document.getElementById("profile-photo").src = cat.image;
      document.getElementById("profile-photo").alt = cat.name + "の写真";
      document.getElementById("profile-name").textContent = cat.name;
      document.getElementById("profile-age").textContent = cat.age;
      document.getElementById("profile-personality").textContent = cat.personality;
      document.getElementById("profile-likes").textContent = cat.likes;
      document.getElementById("profile-care").textContent = cat.care;

      listSection.style.display = "none";
      profile.style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("back-button").addEventListener("click", () => {
      profile.style.display = "none";
      listSection.style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
